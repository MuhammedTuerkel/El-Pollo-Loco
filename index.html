<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El-Pollo-Loco</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/31072aa86b.js" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="img/desert.png" type="image/x-icon">
    <script src="classes/world.class.js"></script>
    <script src="classes/drawableObject.class.js"></script>
    <script src="classes/movable-object.class.js"></script>
    <script src="classes/ThrowableObject.class.js"></script>
    <script src="classes/statusBar.class.js"></script>
    <script src="classes/background-object.class.js"></script>
    <script src="classes/clouds.class.js"></script>
    <script src="classes/keyboard.class.js"></script>
    <script src="classes/chicken.class.js"></script>
    <script src="classes/character.class.js"></script>
    <script src="classes/level.class.js"></script>
    <script src="classes/endboss.class.js"></script>
    <script src="classes/coins.class.js"></script>
    <script src="classes/salsaBottle.class.js"></script>
    <script src="classes/gameOver.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="scripts/game.js"></script>
</head>

<body onload="onload()">
    <h1>El-Pollo-Loco</h1>

    <canvas id="canvas" width="720" height="480">
    </canvas>
    <div id="playText">
        <div class="buttons">
            <button id="arrowleft"><i class="fa-solid fa-arrow-left"></i></button>
            <button id="arrowright"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
        <div class="buttons">
            <button id="arrowup"><i class="fa-solid fa-arrow-up"></i></button>
            <button id="arrowtosing"><i class="fa-solid fa-turn-up"></i></button>
        </div>
    </div>
    <div class="fullscreen">
        <i id="muted" onclick="setMuteInLocalStorage()" class="fa-solid fa-volume-xmark"></i>
        <i id="unmuted" onclick ="setMuteInLocalStorage()" class="fa-solid fa-volume-high"></i>
        <i id="fullscreen" onclick="fullscreenMode()" class="fa-solid fa-expand"></i>
    </div>
    <div class="keysDescription">
        <img src="./img/keyboard.png" alt="">
        <p>A = Move to Left</p>
        <p>D = Move to Right</p>
        <p>E = Throw bottle</p>
        <p>Space = Jump</p>
    </div>
    <div class="rotatemessage">
        <div class="phone">
        </div>
        <div class="message">
            Please rotate your device!
        </div>
    </div>
    <a class="imperessum" href="./imperessum.html">Imperessum</a>
</body>

</html>
